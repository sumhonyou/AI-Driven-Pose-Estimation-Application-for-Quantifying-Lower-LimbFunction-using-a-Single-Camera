# Alembic configuration.
#
# The database URL is deliberately NOT set here -- `alembic/env.py` injects it from
# `app.core.config.settings.database_url`, so credentials stay in the environment and are
# never committed (rules.md #4). This file only needs to tell Alembic where the migration
# scripts live, which is why it is safe to keep in version control.
#
# Usage (from backend/, with the venv active):
#     alembic upgrade head
#     alembic current
#     alembic downgrade -1

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
