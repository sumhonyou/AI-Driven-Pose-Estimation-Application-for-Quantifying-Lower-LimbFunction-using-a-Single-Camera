[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fyp-backend"
version = "0.1.0"
requires-python = ">=3.11"
# Runtime deps stay in requirements.txt (the FastAPI app's own install path);
# this file exists only so `ml/` can `pip install -e .` and import `app.module_b`
# feature functions directly (X1 — no re-implementation, no copy-paste).
dependencies = []

[tool.setuptools.packages.find]
include = ["app*"]

[tool.isort]
profile = "black"
